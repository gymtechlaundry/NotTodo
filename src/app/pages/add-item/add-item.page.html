<ion-header class="ion-no-border">
  <app-toolbar></app-toolbar>
</ion-header>

<ion-content>
  <ion-text color="primary">
    <h3>Own up to your failures.</h3>
  </ion-text>
  
  <div class="content">
    <ion-item>
      <ion-input autocapitalize="sentences" label="What not to do?" labelPlacement="floating" name="title" [(ngModel)]="title" placeholder="Ex. Doomscrolling"></ion-input>
    </ion-item>

    <ion-item>
      <ion-select
        label="Category (optional)"
        labelPlacement="floating"
        interface="popover"
        name="category"
        [(ngModel)]="category"
        placeholder="Choose a category">
        <ion-select-option value="">None</ion-select-option>
        @for (option of categories(); track option) {
          <ion-select-option [value]="option">{{ option }}</ion-select-option>
        }
      </ion-select>
    </ion-item>

    <ion-button class="add-category" fill="clear" shape="round" (click)="addCategory()">
      Add category
    </ion-button>
  
    <ion-row>
      <ion-col size="6">
        <ion-button (click)="cancel()" expand="block" fill="clear" shape="round">
          Cancel
        </ion-button>
      </ion-col>
  
      <ion-col size="6">
        <ion-button (click)="save()" expand="block" fill="clear" shape="round" [disabled]="!title.trim()">
          Save
        </ion-button>
      </ion-col>
    </ion-row>
  </div>
</ion-content>

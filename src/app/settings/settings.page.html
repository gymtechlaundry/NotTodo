<ion-header class="ion-no-border">
  <app-toolbar></app-toolbar>
</ion-header>

<ion-content>
  <ion-text color="primary">
    <h3>Settings to change things up.</h3>
  </ion-text>

  <ion-item>
    <ion-toggle
      [checked]="remindersEnabled()"
      (ionChange)="onToggle($event)">
      <ion-label>Do Not Remind Me</ion-label>
      <ion-note>Not what you want, what you need</ion-note>
    </ion-toggle>
  </ion-item>

  <ion-button
    class="test-reminder"
    expand="block"
    fill="clear"
    shape="round"
    [disabled]="!remindersEnabled()"
    (click)="sendTestReminder()">
    Send a test reminder
  </ion-button>
</ion-content>
